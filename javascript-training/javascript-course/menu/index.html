<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
    />
    <!-- styles.css -->
    <link rel="stylesheet" href="styles/styles.css" />
    <title>Menu</title>
  </head>
  <body>
    <section class="menu">
      <!-- title -->
      <div class="title">
        <h2>Menu</h2>
        <div class="underline"></div>
      </div>
      <!-- filter buttons -->
      <div class="btn-container">
        <!-- <button class="filter-btn" data-id="all" type="button">all</button>
        <button class="filter-btn" data-id="breakfast" type="button">breakfast</button>
        <button class="filter-btn" data-id="lunch" type="button">lunch</button>
        <button class="filter-btn" data-id="shakes" type="button">shakes</button> -->
      </div>
      <!-- menu items -->
      <div class="section-center">
        <!-- item -->
        <article class="menu-item">
          <img src="images/menu-item.jpeg" alt="menu" class="photo" />
          <div class="item-info">
            <header>
              <h4>buttermilk pancakes</h4>
              <h4 class="price">$15</h4>
            </header>
            <p class="item-text">
              Lorem ipsum dolor sit amet consectetur adipisicing elit.
              Necessitatibus, excepturi ex. Facilis quibusdam dolor reiciendis,
              provident a culpa quis quasi minima. Laborum asperiores earum ad
              nam ipsam consequuntur nobis reiciendis.
            </p>
          </div>
        </article>
        <!-- end item -->
      </div>
    </section>

    <script src="script/app.js"></script>
  </body>
</html>
