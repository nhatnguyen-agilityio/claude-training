<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <title>Reviews</title>
</head>
<body>
  <main class="page-main">
    <div class="container">
      <!-- title -->
      <div class="title">
        <h2>Our Reviews</h2>
      </div>
      <!-- review -->
      <article class="review">
        <div class="img-container">
          <img id="img" class="img" src="images/person-1.jpeg" alt="">
        </div>
        <h3 id="name">Anna Johnson</h3>
        <h4 id="job">Web Designer</h4>
        <p id="info">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ab beatae nostrum aspernatur reprehenderit? Consequatur dicta maiores cum eos. Ea eius illo aperiam tenetur, quo veritatis culpa eligendi perferendis dolorum. Dignissimos?</p>
      <!-- button -->
        <div class="button-container">
          <button class="prev-btn">
            <svg aria-hidden="true" focusable="false" data-prefix="fas" data-icon="chevron-left" class="svg-inline--fa fa-chevron-left fa-w-10 icon" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512"><path fill="currentColor" d="M34.52 239.03L228.87 44.69c9.37-9.37 24.57-9.37 33.94 0l22.67 22.67c9.36 9.36 9.37 24.52.04 33.9L131.49 256l154.02 154.75c9.34 9.38 9.32 24.54-.04 33.9l-22.67 22.67c-9.37 9.37-24.57 9.37-33.94 0L34.52 272.97c-9.37-9.37-9.37-24.57 0-33.94z"></path></svg>
          </button>
          <button class="next-btn">
            <svg aria-hidden="true" focusable="false" data-prefix="fas" data-icon="chevron-right" class="svg-inline--fa fa-chevron-right fa-w-10 icon" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512"><path fill="currentColor" d="M285.476 272.971L91.132 467.314c-9.373 9.373-24.569 9.373-33.941 0l-22.667-22.667c-9.357-9.357-9.375-24.522-.04-33.901L188.505 256 34.484 101.255c-9.335-9.379-9.317-24.544.04-33.901l22.667-22.667c9.373-9.373 24.569-9.373 33.941 0L285.475 239.03c9.373 9.372 9.373 24.568.001 33.941z"></path></svg>
          </button>
        </div>
        <button class="random-btn">Suprise Me</button>
      </article>
    </div>
  </main>
  
  <script src="script/app.js"></script>
</body>
</html>
