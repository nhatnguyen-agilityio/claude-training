<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles/styles.css">
  <title>Drawing app</title>
</head>
<body>
  <canvas width="800" height="600" id="canvas"></canvas>
  <div class="toolbox">
    <button class="tool" id="decrease">-</button>
    <input class="tool size" type="text" name="" id="size" disabled>
    <button class="tool" id="increase">+</button>
    <input class="tool" type="color" name="" id="color">
    <button class="tool circle disabled" id="circle"><i class="fas fa-circle"></i></i></button>
    <button class="tool line" id="line"><i class="fas fa-pen"></i></button>
    <button class="tool text" id="text"><i class="fas fa-file-alt"></i></button>
    <input type="text" name="" id="text-value" class="text-value">
    <button class="tool clear" id="clear"><i class="fas fa-eraser"></i></button>
  </div>

  <script src="script/app.js"></script>
</body>
</html>
