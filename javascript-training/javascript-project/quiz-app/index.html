<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/styles.css">
  <title>Quiz app</title>
</head>
<body>
  <div class="container">
    <div class="quiz-content">
      <h3 id="question">Questions</h3>
      <div>
        <ul class="quiz-ans">
          <li>
            <input class="answer" type="radio" name="answer" id="a" value="a">
            <label id="answer-a" for="a">a</label>
          </li>
          <li>
            <input class="answer" type="radio" name="answer" id="b" value="b">
            <label id="answer-b" for="b">b</label>
          </li>
          <li>
            <input class="answer" type="radio" name="answer" id="c" value="c">
            <label id="answer-c" for="c">c</label>
          </li>
          <li>
            <input class="answer" type="radio" name="answer" id="d" value="d">
            <label id="answer-d" for="d">d</label>
          </li>
        </ul>
      </div>
    </div>
      <button id="btn">submit</button>
  </div>

  <script src="script/app.js"></script>
</body>
</html>
