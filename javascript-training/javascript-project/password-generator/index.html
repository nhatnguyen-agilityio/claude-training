<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles/styles.css" />
    <title>Password generator</title>
  </head>
  <body>
    <div class="container">
      <h2 class="heading">Password Generator</h2>
      <div class="result">
        <span class="result-pass" id="pass"></span>
        <button class="btn copy" id="copy"><i class="fas fa-copy"></i></button>
      </div>
      <div class="setting">
        <div class="setting-card">
          <label for="">Password length</label>
          <input type="number" class="pass-length" name="" id="len" min="8" max="30" />
        </div>
        <div class="setting-card">
          <label for="">Include uppercase letters</label>
          <input type="checkbox" name="" id="upper" />
        </div>
        <div class="setting-card">
          <label for="">Include lowercase letters</label>
          <input type="checkbox" name="" id="lower" />
        </div>
        <div class="setting-card">
          <label for="">Include number</label>
          <input type="checkbox" name="" id="number" />
        </div>
        <div class="setting-card">
          <label for="">Include symbols</label>
          <input type="checkbox" name="" id="symbol" />
        </div>
      </div>
      <button class="btn btn-generate" id="generate">Generate password</button>
    </div>

    <script src="script/app.js"></script>
  </body>
</html>
