<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/form.css">
  <title>Exercise-three: Form</title>
</head>
<body>
  <div class="container">
    <h1>Sign Up Page</h1>
    <form action="" id="btnSubmit">
      <div class="box">
        <label for="first-name">Email:
        </label>
        <input type="text" name="" id="email">
        <p class="error-message"></p>
      </div>
      
      <div class="box">
        <label for="last-name">Username:
        </label>
        <input type="text" name="" id="username">
        <p class="error-message"></p>
      </div>

      <div class="box">
        <label for="password">Password
        </label>
        <input type="password" name="" id="password">
        <p class="error-message"></p>
      </div>

      <div class="box">
        <label for="password">Confirm Password
        </label>
        <input type="password" name="" id="confirm-password">
        <p class="error-message"></p>

      </div>
      <div class="submit">
        <input type="submit" class="btn" value="Sign Up">
        <input id="reset" type="button" class="btn" value="Reset">
      </div>
      <div class="message"></div>
    </form>
  </div>

  <script src="script/form.js"></script>
</body>
</html>
